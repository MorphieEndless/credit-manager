name: One-off patch (directory key metadata)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-directory-key.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Apply patch
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path("internal/plugin/auth.go")
          s = p.read_text(encoding="utf-8")
          orig = s

          # 1) import "time" right after the "strings" import, reusing its indent.
          lines = s.split("\n")
          added = False
          for idx, line in enumerate(lines):
              if line.strip() == '"strings"':
                  indent = line[: len(line) - len(line.lstrip())]
                  lines.insert(idx + 1, indent + '"time"')
                  added = True
                  break
          if not added:
              sys.exit("strings import not found")
          s = "\n".join(lines)

          # 2) rewrite resolveDirectoryKey and append metadataKeyID.
          start = s.find("// resolveDirectoryKey identifies")
          if start < 0:
              sys.exit("resolveDirectoryKey comment not found")
          sig = s.find("func resolveDirectoryKey(", start)
          if sig < 0:
              sys.exit("resolveDirectoryKey func not found")
          end = s.find("\n}\n", sig)
          if end < 0:
              sys.exit("resolveDirectoryKey body end not found")

          new_block = '''// resolveDirectoryKey identifies the requesting plugin key for a model
// directory response. The primary path reads the key id that authenticate()
// recorded in FrontendAuthResponse metadata: that value survives into this
// request's metadata no matter how the credential was carried, which is the
// only way a ?key= client can be identified here, because
// ResponseInterceptRequest exposes no query string. Fallbacks: credential
// headers (Bearer / x-goog-api-key / x-api-key) and the caller_scope handle
// derived from the host principal. Unresolvable or invalid keys yield nil:
// the directory then degrades to global filtering only.
func resolveDirectoryKey(ctx context.Context, svc *service.Service, req pluginapi.ResponseInterceptRequest) *store.PluginKey {
    if kid := metadataKeyID(req.Metadata); kid != "" {
        if key, err := svc.Store().GetPluginKeyByKid(ctx, kid); err == nil {
            if err := store.EnsurePluginKeyUsable(key, time.Now().UTC()); err == nil {
                return &key
            }
        }
    }
    key, _, err := svc.ResolveIdentity(ctx, req.RequestHeaders, req.Metadata)
    if err == nil && strings.TrimSpace(key.ID) != "" {
        return &key
    }
    return nil
}

// metadataKeyID reads the plugin key id that authenticate() reported for the
// request. FrontendAuthResponse metadata reaches downstream interceptors as-is,
// so the value is normally a plain string; tolerate JSON-decoded shapes too.
func metadataKeyID(metadata map[string]any) string {
    if metadata == nil {
        return ""
    }
    switch typed := metadata["kid"].(type) {
    case string:
        return strings.TrimSpace(typed)
    case []string:
        if len(typed) > 0 {
            return strings.TrimSpace(typed[0])
        }
    case []any:
        if len(typed) > 0 {
            if value, ok := typed[0].(string); ok {
                return strings.TrimSpace(value)
            }
        }
    }
    return ""
}
'''
          s = s[:start] + new_block + s[end + 3 :]

          if s == orig:
              sys.exit("no changes produced")
          p.write_text(s, encoding="utf-8")
          print("auth.go patched")
          PY

      - name: Format and verify
        run: |
          set -euo pipefail
          gofmt -w internal/plugin/auth.go
          test -z "$(gofmt -l internal/plugin/auth.go)"
          go build ./...
          go vet ./internal/plugin/...
          grep -c metadataKeyID internal/plugin/auth.go

      - name: Commit and retire this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/plugin/auth.go
          git rm -q .github/workflows/oneoff-directory-key.yml
          git commit -m "fix(plugin): resolve directory key from auth metadata for ?key= clients"
          git push

      # A bot push cannot trigger build.yml, so build and publish here.
      - name: Build Unix dynamic library
        shell: bash
        env:
          GOAMD64: v1
          CGO_CFLAGS: '-O2 -g -march=x86-64'
          CGO_CXXFLAGS: '-O2 -g -march=x86-64'
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 go build -buildmode=c-shared -o dist/credit-manager.so .
          section="$(objdump -d --no-show-raw-insn dist/credit-manager.so | sed -n '/<x_cgo_sigaction>:/,/^$/p')"
          test -n "$section"
          if printf '%s\n' "$section" | grep -qE '\b(shlx|mulx|andn|bzhi|bextr|sarx|pdep|pext)\b'; then
            echo "BMI2 leaked into x_cgo_sigaction" >&2
            exit 1
          fi
          sha256sum dist/credit-manager.so

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: Latest plugin build
          body: Rolling build of main, published automatically.
          files: dist/credit-manager.so
          prerelease: true
          make_latest: false
