name: Restyle plugin web assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/restyle/**'
      - '.github/workflows/restyle.yml'

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Decode restyle scripts
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          pairs = [
              ("scripts/restyle/apply_console_css.py.gz.b64", "scripts/restyle/apply_console_css.py"),
              ("scripts/restyle/apply_remaining.py.gz.b64", "scripts/restyle/apply_remaining.py"),
          ]
          for src, dst in pairs:
              raw = pathlib.Path(src).read_text()
              data = gzip.decompress(base64.b64decode(raw, validate=False))
              pathlib.Path(dst).write_bytes(data)
              print(f"decoded {src} -> {dst} ({len(data)} bytes)")
          PY

      - name: Apply CPAMP blue-white restyle
        run: |
          python3 scripts/restyle/apply_console_css.py
          python3 scripts/restyle/apply_remaining.py

      - name: Verify JS syntax
        run: |
          node --check internal/management/web/console.js
          node --check internal/management/web/lookup.js

      - name: Commit restyled assets
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/management/web/ scripts/restyle/
          git commit -m "style(web): align plugin UI with CPAMP blue-white glass design"
          git push
